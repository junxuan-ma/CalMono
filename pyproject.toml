[build-system]
requires = ["setuptools>=82.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "calmono"
version = "0.1.0"
description = "Calcium imaging analysis of bovine DRG neurons"
authors = [
  { name="Junxuan Ma", email="Junxuan.Ma@aofoundation.org" }
]
dependencies = [
   "czifile>=2026.3.17",
   "numpy>=2.1.2",
   "scipy>=1.14.1",
   "pandas>=2.2.3",
   "matplotlib>=3.9.2",
   "seaborn>=0.13.2",
   "scikit-learn>=1.5.2",
   "opencv-python>=4.10.0.84",
   "scikit-image>=0.25.0"
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
license = {text = "MIT"}


[tool.setuptools.packages.find]
where = ["src"]
namespaces = false